# SPDX-License-Identifier: GPL-2.0
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # sid, forky and the backports kernels change without a push.
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends bear
          # Pinned so formatting and findings match local runs.
          pip install clang-format==23.1.3 clang-tidy==23.1.4 shellcheck-py==0.11.0.1
          # checkpatch.pl reads its data files from its own directory.
          mkdir -p "$RUNNER_TEMP/checkpatch"
          for f in checkpatch.pl spelling.txt const_structs.checkpatch; do
            curl -sfL -o "$RUNNER_TEMP/checkpatch/$f" \
              "https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git/plain/scripts/$f?h=v7.2"
          done
          chmod +x "$RUNNER_TEMP/checkpatch/checkpatch.pl"

      - name: clang-format
        run: make format-check

      - name: checkpatch
        run: make checkpatch CHECKPATCH="$RUNNER_TEMP/checkpatch/checkpatch.pl"

      - name: shellcheck
        run: make shellcheck

      - name: clang-tidy (userspace)
        run: make tidy-user

  debian:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite:
          - bookworm # 6.1
          - bookworm-backports # 6.12
          - trixie # 6.12
          - trixie-backports # newest stable kernel
          - forky # testing
          - sid
    name: debian (${{ matrix.suite }})
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install mmdebstrap and QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends mmdebstrap qemu-system-x86 e2fsprogs

      - name: Build and test in a ${{ matrix.suite }} guest
        run: tests/debian/run.sh ${{ matrix.suite }}

      - name: Upload console log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: console-${{ matrix.suite }}
          path: build/debian/${{ matrix.suite }}/
          if-no-files-found: ignore
